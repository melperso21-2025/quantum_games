<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Quantum Games</title>
        <link href="./output.css" rel="stylesheet" />
        <link rel="icon" type="image/png" href="./favicon.png">
    </head>
    <body class="bg-slate-100 min-h-screen">
        
        <header 
            class="sticky top-0 z-40 bg-slate-900 text-white px-6 py-4 flex items-center justify-between shadow-lg">
            <div>
                <h1 class="text-2xl font-bold tracking-tight">Quantum Games</h1>
                <p class="text-sm text-slate-200">El futuro del gaming empieza aquí</p>
            </div>
            <span class="text-xs text-slate-300">v1.0 · demo educativa</span>
        </header>
    
        <main class="p-6 max-w-6xl mx-auto">
            <!-- BARRA DE BÚSQUEDA / CONTROLES -->
            <section 
                class="sticky top-20 z-30 bg-slate-100 mb-6 pb-4 flex flex-col gap-3 md:flex-row md:items-center md:justify-between">
                <div class="flex items-center gap-2 w-full md:max-w-md">
                    <input
                        id="input-busqueda"
                        type="text"
                        placeholder="Buscar videojuego..."
                        class="w-full rounded-lg border border-slate-200 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-400"
                    />
                    <button 
                        id="btn-buscar"
                        class="px-4 py-2 bg-slate-900 text-white rounded-lg text-sm hover:bg-slate-800">
                        Buscar
                    </button>
                </div>
            
                <div class="flex gap-2">
                    <select
                        class="rounded-lg border border-slate-200 px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-slate-400"
                    >
                        <option value="">Plataforma</option>
                        <option value="pc">PC</option>
                        <option value="ps5">PlayStation</option>
                        <option value="xbox">Xbox</option>
                        <option value="switch">Nintendo Switch</option>
                    </select>
                
                    <select
                        id="select-tienda"
                        class="rounded-lg border border-slate-200 px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-slate-400"
                    >
                        <option value="">Todas las tiendas</option>
                    </select>
                    
                    <select
                        id="select-ordenar"
                        class="rounded-lg border border-slate-200 px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-slate-400"
                    >
                        <option value="">Ordenar por</option>
                        <option value="sale-asc">Precio Oferta ↑ (Menor)</option>
                        <option value="sale-desc">Precio Oferta ↓ (Mayor)</option>
                        <option value="normal-asc">Precio Normal ↑ (Menor)</option>
                        <option value="normal-desc">Precio Normal ↓ (Mayor)</option>
                    </select>
                </div>
            </section>
            
            <!-- GRID DE VIDEOJUEGOS -->
            <section>
                <!-- Encabezado con título y controles de paginación -->
                <div class="sticky top-44 z-20 bg-slate-100 flex flex-col md:flex-row md:items-center md:justify-between mb-4 gap-4 pb-4">
                    <h2 class="text-lg font-semibold text-slate-800">
                        Videojuegos destacados
                    </h2>
                    
                    <!-- Controles de paginación -->
                    <div class="flex items-center gap-2">
                        <button 
                            id="btn-prev"
                            class="px-3 py-2 bg-slate-900 text-white rounded-lg text-sm hover:bg-slate-800 disabled:opacity-50 disabled:cursor-not-allowed">
                            ← Anterior
                        </button>
                        <span id="info-paginacion" class="text-sm text-slate-600 min-w-fit">
                            Página 1
                        </span>
                        <button 
                            id="btn-next"
                            class="px-3 py-2 bg-slate-900 text-white rounded-lg text-sm hover:bg-slate-800 disabled:opacity-50 disabled:cursor-not-allowed">
                            Siguiente →
                        </button>
                    </div>
                </div>
                
                <!--Etiqueta para cargar video juegos -->
                <p id="estado-carga" class="text-sm text-slate-500 mb-3 items-center gap-2 hidden">
                    <span class="loader w-4 h-4 border-2 border-slate-300 border-t-slate-900 rounded-full animate-spin"></span>
                    Cargando videojuegos...
                </p>

                <!--Etiqueta para errores de carga de video juegos -->
                <p 
                    id="estado-error" class="text-sm text-red-500 mb-3 hidden"> 
                    Error al cargar los video juegos. Inténtalo de nuevo más tarde...
                </p>
                
                <div 
                    id="grid-videojuegos"
                    class="grid gap-6 grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4"
                >
                    
                </div>
            </section>
        </main>

        <script src="./script.js"></script>
        
        <!-- MODAL DE DETALLE -->
        <div id="modal-overlay"
            class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden justify-center items-center z-50">
            
            <div class="bg-white rounded-xl shadow-lg p-6 max-w-md w-full relative select-none" style="cursor: grab;">
                
                <!-- Botón cerrar -->
                <button id="modal-close" 
                    class="absolute top-3 right-3 text-slate-600 hover:text-slate-900 text-xl">
                    &times;
                </button>

                <div id="modal-content">
                    <!-- Aquí JS insertará la información -->
                    <p class="text-center text-slate-600 text-sm">Cargando detalles...</p>
                </div>
            </div>
        </div>

    </body>
</html>
